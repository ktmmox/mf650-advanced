<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>5G MIFI · 设备控制台</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/dark.css"></head><body>
